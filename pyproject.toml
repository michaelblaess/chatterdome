[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-sanctuary"
version = "0.2.0"
description = "Zentrale fuer mehrere gleichzeitig laufende Claude-Code-Instanzen"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Blaess" }]
dependencies = [
    "textual>=1.0",
    "rich>=13.0",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
    "textual-widgets[images] @ git+https://github.com/michaelblaess/textual-widgets.git",
    # Diagramme im Terminal fuer den Statistik-Tab. MIT-lizenziert und damit
    # vertraeglich mit Apache 2.0, in jira-timesheet bereits erprobt.
    "textual-plotext>=1.0",
    # Datei-Dialog fuer "Verlauf speichern unter". MIT-lizenziert, in
    # jira-timesheet und sitemap-tracker bereits im Einsatz.
    "textual-fspicker>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.6",
    "poethepoet>=0.29",
    # TestClient von FastAPI setzt httpx voraus.
    "httpx>=0.27",
    # Selbstbezug: mypy prueft web/serve.py und braucht dafuer textual-serve.
    # Ohne das war die CI ab ed3b055 rot, weil sie nur "--extra dev" installiert.
    "claude-sanctuary[web]",
]
web = [
    "textual-serve>=1.1.3",
    # Eigene Weboberflaeche: FastAPI bringt Routen und WebSocket mit, Jinja
    # die Vorlagen, uvicorn den Server, itsdangerous signiert das
    # Sitzungscookie der Anmeldung.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    # Ohne das lehnt FastAPI jede Route mit Form(...) schon beim Bau ab - das
    # Anmeldeformular waere tot. Fiel erst im Testlauf auf, nicht beim Import.
    "python-multipart>=0.0.9",
]

[project.scripts]
sanctuary-tui = "claude_sanctuary.__main__:main"
# Browser-Zugang ueber textual-serve, braucht das Extra "web". Schnellschuss
# vom 15.09.2026, faellt weg sobald sanctuary-http die Uebersicht kann.
sanctuary-web = "claude_sanctuary.web.serve:main"
# Eigene Weboberflaeche mit Agentenliste und Terminal, braucht dasselbe Extra.
sanctuary-http = "claude_sanctuary.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_sanctuary = [
    "locale/*.json",
    "tui/*.tcss",
    # Vorlagen und Bibliotheken der Weboberflaeche. xterm.js und Tabler liegen
    # bewusst im Repo statt an einem CDN: das Werkzeug soll ohne Zugriff nach
    # aussen laufen, und der Browser auf dem Tablet soll nichts nachladen.
    "web/templates/*.html",
    "web/static/*",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["textual_themes.*", "textual_widgets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.poe.tasks]
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"
test = "pytest"

# Die Skripte unter skills/ sind Node und werden von pytest nicht erfasst. Sie
# tragen aber die Adressierung des Bus, und dort sass der Fehler vom
# 07.08.2026 - deshalb ein eigenes Tor statt gar keins.
#
# Muster statt Einzelliste: hier standen vier Dateien namentlich, und
# skills/operator/vergabe.test.mjs fiel dadurch monatelang aus dem Tor - die
# Datei war gruen, lief aber weder lokal noch in der CI. Ein Test, der nie
# laeuft, ist kein Schutz. Das Muster loest node selbst auf (nicht die Shell),
# deshalb die Anfuehrungszeichen.
test-js = "node --test \"skills/**/*.test.mjs\""
alles = ["lint", "typecheck", "test", "test-js"]
